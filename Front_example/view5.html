<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SVG Полигон</title>
    <link rel="stylesheet" href="view5.css">
</head>
<body>
    <div class="container">
        <div class="left-column">
            <svg id="svgCanvas" width="500" height="500">
                <polygon id="polygon" points="" fill="none" stroke="black"/>
            </svg>
<!--            <svg id="svgCanvas" width="100%" height="100%" viewBox="0 0 40 40" preserveAspectRatio="xMidYMid meet">-->
<!--                <polygon id="polygon" points="" fill="none" stroke="black"/>-->
<!--            </svg>-->

        </div>
        <div class="right-column">
            <input type="text" id="coord1" placeholder="x1,y1">
            <input type="text" id="coord2" placeholder="x2,y2">
            <input type="text" id="coord3" placeholder="x3,y3">
            <input type="text" id="coord4" placeholder="x4,y4">
            <button id="redrawButton">Перерисовать полигон</button>
            <button id="savePolygonButton">Сохранить полигон</button>
            <button id="displayPolygonsButton">Вывести все полигоны</button>
            <div id="polygonList" class="polygon-list"></div>
            <div id="selectedPolygonCoords" class="selected-polygon-coords"></div>

        </div>
    </div>
    <script src="view5.js"></script>
</body>
</html>
