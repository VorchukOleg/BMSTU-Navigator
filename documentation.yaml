  /get_room_coords:
    get:
      tags:
        - rooms
      summary: возвращает координаты svg polygon для помещения с заданным uuid
      description: Возвращает все этажи строения с данным uuid 
      parameters:
        - name: uuid
          in: query
          description: uuid помещения, для которого нужно вернуть координаты
          required: true
          schema:
            type: string
            example: "05048978-1901-41a8-be66-bfa35a6d9ba4"
      responses:
        '200':
          description: OK
          content:
              application/json:
                example: {
    "1": {
