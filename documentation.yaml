openapi: 3.0.3
info:
  title: BMSTU Navigator
  
  termsOfService: http://swagger.io/terms/
  contact:
    email: apiteam@swagger.io
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.11
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
servers:
  - url: http://127.0.0.1:5000
 
  
tags:
  - name: base nodes
    description: Операции, связанные с базовыми точками
  - name: buildings  
    description: Операции, связанные со строениями
  - name: rooms 
    description: Операции, связанные со помещениями
  - name: floors 
    description: Операции, связанные этажами
    
paths:
  /base_nodes/add_base_point:
    post:
      tags:
        - base nodes
      summary: Добавляет базовую точку в базу данных 
      description: Добавляет базовую точку в базу данных 
      requestBody:
        content:
          application/json:
             schema:
               $ref: '#/components/schemas/base_point'
        required: true
      responses:
        '200':
          description: Record was successfully added
          
  /base_nodes/get_base_point/{floor_uuid}:
    get:
      tags:
        - base nodes
      summary: Возвращает информацию о всех базовых точках на этаже 
      description: Возвращает информацию о всех базовых точках на этаже
      parameters:
        - name: floor_uuid
          in: path
          description: Этаж, базовые точки с которого нужно вернуть
          required: true
          schema:
            type: string
            example: "2d37f5c4-9d6c-4e28-ae66-40a1f3e3347f"
      responses:
        '200':
          description: OK
          content:
              array:
                schema:
                  type: array
                  items:  {$ref: '#/components/schemas/base_point'}
                  example: [
    {
      "basepoint_uuid": "0361753a-8cda-4b95-8534-b0dd21d81dc9",  
      "displayed_name": "коридор 8",  
      "private_name": "DOMRF_6_base_8",  
      "coordinates": { "1": {"x": 72, "y": 0}, 
      "2": {"x": 190, "y": 0}, 
      "3": {"x": 190, "y": 130}, 
      "4": {"x": 72, "y": 130}
        
      }
    },
]
        '404':
          description: Records not found
        
  /base_nodes/{basenode_uuid}:
    get:
      tags:
        - base nodes
      summary: Возвращает информацию о базовой точке и её связях по её uuid
      description: Возвращает информацию о базовой точке и её связях по её uuid
      parameters:
        - name: basenode_uuid
          in: path
          description: UUID базовой точки, о которой нужно вернуть данные
          required: true
          schema:
            type: string
            example: "0361753a-8cda-4b95-8534-b0dd21d81dc9"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/base_point_with_connections'
        '404':
          description: Records not found 
   
  /base_nodes/{basenode_uuid}/connection:
     post:
      tags:
        - base nodes
      summary: Создаёт связь между базовыми точками  
      description: Этот запрос создает в таблице base_connection строĸу, в ĸоторой описывается связь базовой точĸи с uuid = 1 с точĸой переданной в теле запроса (допустим с базовой точĸой с uuid = 3). То есть после успешного совершения таĸого запроса у точĸи с uuid = 1 появится связь с точĸой 3 с весом 5, а ĸроме того, еще должна появиться связь 3 точĸи с 1 (в обратную сторону с таĸим же весом)
      parameters:
        - name: basenode_uuid
          in: path
          description: uuid базовой точки, для которой нужно создать связь
          required: true
          schema:
            type: string
            example: "6291b50f-05b6-45f4-a41b-fbb4c9e5c961"

      requestBody:
        content:
          application/json:
             schema:
               $ref: '#/components/schemas/connection_creation_json'
        required: true
      responses:
        '200':
          description: Record was successfully added
          
  /get_all_baseconnections:
    get:
      tags:
        - base nodes
      summary: возвращает все существующие связи между базовыми точками
      description: возвращает все существующие связи между базовыми точками
      responses:
        '200':
          description: OK
          content:
            array:
              example:
                [
    [
    "6291b50f-05b6-45f4-a41b-fbb4c9e5c961",
    "b67393ad-8609-404c-902c-4ee302fba86e",
    67
  ],
  [
    "44585ce8-3641-40c1-9c1f-7324d0340c57",
    "b67393ad-8609-404c-902c-4ee302fba86e",
    88
  ],
]
        '404':
          description: Records not found 
          
  /get_room_basepoint:
    get:
      tags:
        - rooms
      summary: возвращает uuid базовой точки, с которой соединено данное помещение
      description: возвращает uuid базовой точки, с которой соединено данное помещение
      parameters:
        - name: uuid
          in: query
          description: uuid помещения, для которого нужно найти связанную базовую точку
          required: true
          schema:
            type: string
            example: "05048978-1901-41a8-be66-bfa35a6d9ba4"
      responses:
        '200':
          description: OK
          content:
            string:
              example: "68ee8a75-6dea-41b7-a922-e15ad93763bb"
        '404':
          description: Records not found       
  
  /buildings/add_building:
    post:
      tags:
        - buildings
      summary: Добавляет строение в базу данных 
      description: Добавляет строение в базу данных 
      requestBody:
        content:
          application/json:
             schema:
               $ref: '#/components/schemas/building'
        required: true
      responses:
        '200':
          description: Record was successfully added
          
  /buildings/get_all_buildings:
    get:
      tags:
        - buildings
      summary: Возвращает все строения  
      description: Возвращает все строения   
      responses:
        '200':
          description: OK
          content:
              array:
                schema:
                  type: array
                  items:  {$ref: '#/components/schemas/building'}
                  example: [
  {
    "uuid": "8250b9ba-bc0d-4d2f-abf7-d91265e89050",
    "displayed_name": "Research Center",
    "private_name": "Дом РФ",
    "describtion": null,
    "floor_count": 5
  },
  {
    "uuid": "49f17cc8-7600-4f46-bd93-687a0439cf14",
    "displayed_name": "УЛК",
    "private_name": "Учебно-лабораторный корпус",
    "describtion": "Учебно-лабораторный корпус МГТУ им. Баумана",
    "floor_count": 12
  },
]       

  /floors/{building_uuid}:
    get:
      tags:
