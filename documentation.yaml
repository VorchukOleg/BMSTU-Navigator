  /get_path:
    get:
      tags:
        - rooms
      summary: возвращает путь между помещениями и его длину  
      description: возвращает путь между помещениями с id "from" и "to" в виде последовательности uuid базовых точек, по которым нужно пройти, чтобы добраться до пункта назначения (путь состоит именно из uuid базовых точек, id "from" и "to" в массив из uuid базовых точек не включаются, потому что "from" и "to" не базовые точки); также возвращает длину этого пути
      parameters:
        - name: from
          in: query
          description: uuid базовой точки начала пути
          required: true
          schema:
            type: string
            example: "05048978-1901-41a8-be66-bfa35a6d9ba4"
        - name: to
          in: query
          description: uuid базовой точки конца пути
          required: true
          schema:
            type: string
            example: "0e839584-b3a3-46d7-a1e7-6d5636c9c60a"   
      responses:
        '200':
          description: OK
          content:
              application/json:
                schema: {$ref: '#/components/schemas/path'}
                example:   {
  "from": {
    "floor_uuid": "6976031d-c6df-41f0-a2c8-9d17bac4dd5f",
    "room_uuid": "05048978-1901-41a8-be66-bfa35a6d9ba4"
  },
  "to": {
    "floor_uuid": "d5a94bf3-3e6b-4c7a-bf4d-2cd4186a2390",
    "room_uuid": "0e839584-b3a3-46d7-a1e7-6d5636c9c60a"
  },
  "path": [
    {
      "floor_uuid": "6976031d-c6df-41f0-a2c8-9d17bac4dd5f",
      "basenode_uuid": "68ee8a75-6dea-41b7-a922-e15ad93763bb"
    },
    {
      "floor_uuid": "6976031d-c6df-41f0-a2c8-9d17bac4dd5f",
      "basenode_uuid": "62f0931a-8c44-475a-bcd3-b52a57eafa78"
    },
  ],
  "lenth": 75
}         
                
  
  
components:
  schemas:
    base_point:
      required:
        - floor_uuid
      type: object
      properties:
        uuid:
          type: string
          description: uuid
          example: 123e4567-e89b-12d3-a456-426655440000
        floor_uuid:
          type: string
          description: uuid этажа, на котором расположена базовая точка
          example: "d5a94bf3-3e6b-4c7a-bf4d-2cd4186a2390" 
        coordinates:
          description: координаты svg polygon, соответствующего данной базовой точке 
          type: object
          example: {"1": {"x": 0, "y": 112}, "2": {"x": 60, "y": 112}, "3": {"x": 60, "y": 131}, "4": {"x": 73, "y": 131}, "5": {"x": 73, "y": 167}, "6": {"x": 0, "y": 167}}
        
          
    base_point_with_connections:
      type: object
      properties:
        uuid:
          type: string
          description: uuid
          example: 0361753a-8cda-4b95-8534-b0dd21d81dc9
        coordinates:
          type: object
          description: координаты svg polygon, соответствующего данной базовой точке 
          example:  {"1": { "x": 72, "y": 0 }, "2": { "x": 190, "y": 0}, "3": {"x": 190,"y": 130},"4": {"x": 72,"y": 130}}
    
        floor_id:
          type: integer
          description: id этажа, на котором расположена базовая точка
          example: 1  
        connections:
          type: array
          description: массив связей, которыми обладает данная базовая точка
          items:  {$ref: '#/components/schemas/connection_with_id' }
          example: [
        "floor_uuid": "d5a94bf3-3e6b-4c7a-bf4d-2cd4186a2390", "connections": [
    {
      "uuid": "a8ae8ecb-1017-40c7-99dc-0644dfb0be11",
      "weight": 85,
      "connection_type": null,
      "basepoint_1_uuid": "0361753a-8cda-4b95-8534-b0dd21d81dc9",
      "basepoint_2_uuid": "4641a07e-adc5-4548-a30e-dc271ec7fd22"
    }
  ]
    ]
          
    connection_with_id:
      required:
        - floor_base_connection_id
        - weight
        - connection_type
        - base_point_1_id
        - base_point_2_id
        - floor_id
      type: object
      properties:
        base_connection_id:
          type: integer
          description: id связи
          example: 3
        weight: 
          type: integer
          description: весовой коэффициет ребра в математического модели взвешенного графа
          example: 5
        connection_type: 
          type: string
          description: тип связли, пользовательский тип данных, значение выбирается из списка доступных значений
          example: null,
        base_point_1_id: 
          description: id 1-ой точки (вершины) инцидентной ребру, соответствующему текущей связи
          type: integer
          example: 4
        base_point_2_id: 
          type: integer
          description: id 2-ой точки (вершины) инцидентной ребру, соответствующему текущей связи
          example: 3
        floor_id: 
          type: integer
          description: id этажа, на котором расположена базовая точка
          example: 1
    
    connection_creation_json:
      type: object
      properties:
        node_uuid: 
          description: uuid базовой точки, с которой нужно связать точку, чей uuid передаётся в виде path параметра
          type: string
          example: "0121fdd7-8b4f-44e4-bbc3-0215101b10d3"

        floor_uuid:
          description: uuid этажа
          type: string
          example: "31f6d537-d1db-42a6-9e36-d45e9b14b79d"
          
        weight: 
          description: весовой коэффициет ребра в математического модели взвешенного графа
          type: integer
          example: 2
          
    building:
      required:
        - displayed_name
      type: object
      properties:
        building_uuid:
          type: string
          description: uuid
          example: 123e4567-e89b-12d3-a456-426655440000
        displayed_name:
          description: отображаемое имя 
          type: string
          example: "Главное Здание"
        private_name:
          description: скрытое имя
          type: string
          example: "ГЗ"  
        description:
          description: описание
          type: string
          example: "Веселуха" 
        floor_count:
          description: кол-во этажей
          type: integer
          example: 8 
          
    floor:
      required:
        - displayed_name
      type: object
      properties:
        uuid:
          type: string
          description: uuid
          example: 123e4567-e89b-12d3-a456-426655440000
        displayed_name:
          description: отображаемое имя 
          type: string
          example: "1-ый этаж УЛК"
        private_name:
          description: скрытое имя
          type: string
          example: "1-ый этаж учебно-лабораторного корпуса"  
        description:
          description: описание
          type: string
          example: "1-ый этаж учебно-лабораторного корпуса МГТУ им. Баумана"
        building_id:
          description: ID здания, в котором расположен этаж
          type: integer
          example: 1        
          
          
    room:
      required:
        - displayed_name
      type: object
      properties:
        uuid:
          type: string
          description: uuid
          example: 123e4567-e89b-12d3-a456-426655440000
        displayed_name:
          description: отображаемое имя 
          type: string
          example: "515ю"
        private_name:
          description: скрытое имя
          type: string
          example: "Аудитория 515ю"  
        description:
          description: описание
          type: string
          example: "Аудитория 515ю"   
          
    path:
      type: object
      properties:
        from: 
          description: id помещения, из которого необходимо построить маршрут
          type: string
          example: "1"
    
        to: 
          description: id помещения, до которого необходимо построить маршрут
          type: string
          example: "2"
        path: 
          type: array
          description: путь
          items:  {type: integer}
          example: [1,
        2,
        3]
          
        lenth: 
          description: длина пути
          type: integer
          example: 15

            
           
  
              
      
 